id: blank_time_series_growth
type: blank
tool:
  name: tool_create_blank_plot
  alias: create_ggplot
input:
  setup: |
    library(ggplot2)
    set.seed(789)
    df <- data.frame(
      time = 1:12,
      value = cumsum(rnorm(12, mean = 5, sd = 2))
    )
  teardown: |
    rm(df)
  prompt: |
    Create a line plot showing value over time using the df dataset. Describe
    any trends you observe.
target: |
  The plot shows only axis labels with no data points or visualization. The
  x-axis is labeled "time" and the y-axis is labeled "value", but the plot
  area is completely blank/empty with no lines, points, or other visual elements.
