id: image_matched_categorical_no_difference
type: image_interpretation
tool:
  name: tool_show_image
  alias: show_plot
metadata:
  n_geoms: 1
  geom_type: boxplot
  pattern_type: categorical
  relationship: no_difference
  difficulty: medium
  pattern_source: standard
input:
  setup: |
    image_path <- "sample-images/baseline/categorical_no_difference.png"
  teardown: ""
  prompt: |
    Please call the show_plot tool to display the visualization, then briefly tell me what patterns you see.
target: |
  The plot shows almost no differences between states.
  All three states (Alpha, Beta, Gamma) have near identical distributions of
  values with overlapping ranges and similar/the same medians. A successful
  submission accurately describes a lack of differences between states, while
  optionally mentioning the presence of outliers for each distribution.
