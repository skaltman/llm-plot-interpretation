id: image_matched_threshold_effect
type: image_interpretation
tool:
  name: tool_show_image
  alias: show_plot
metadata:
  n_geoms: 1
  geom_type: point
  pattern_type: threshold
  relationship: discontinuous
  difficulty: hard
  pattern_source: unusual
input:
  setup: |
    image_path <- "sample-images/baseline/threshold_effect.png"
  teardown: ""
  prompt: |
    Use the show_plot tool to display the visualization then briefly describe what you see in the plot
target: |
  The plot shows a clear threshold effect with two distinct regions: lower outcomes below level 15 and substantially higher
  outcomes above level 15. A successful submission accurately describes that there is a discontinuity or threshold effect around level 15,
  or that outcome jumps up at a certain point, or that there are two different relationships before and after a threshold, or that the pattern
  shows a sudden increase rather than a smooth trend. Submissions may note the approximate location of the threshold or describe it as
  a step change.
