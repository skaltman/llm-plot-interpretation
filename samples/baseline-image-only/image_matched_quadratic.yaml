id: image_matched_quadratic
type: image_interpretation
tool:
  name: tool_show_image
  alias: show_plot
metadata:
  n_geoms: 1
  geom_type: point
  pattern_type: quadratic
  relationship: nonlinear
  difficulty: medium
  pattern_source: standard
input:
  setup: |
    image_path <- "sample-images/baseline/quadratic.png"
  teardown: ""
  prompt: |
    Use the show_plot tool to display the visualization, then succinctly tell me what relationship you see.
target: |
  The plot shows a U-shaped or quadratic relationship between x and y.
  The y values are highest at the extremes of x and lowest near the middle.
  A successful submission accurately describes this curved, non-linear relationship.
