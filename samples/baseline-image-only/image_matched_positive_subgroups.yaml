id: image_matched_positive_subgroups
type: image_interpretation
tool:
  name: tool_show_image
  alias: show_plot
metadata:
  n_geoms: 1
  geom_type: point
  pattern_type: linear
  relationship: positive_with_groups
  difficulty: medium
  pattern_source: standard
input:
  setup: |
    image_path <- "sample-images/baseline/positive_subgroups.png"
  teardown: ""
  prompt: |
    Call show_plot tool to display the visualization, then briefly tell me what you see.
target: |
  The plot shows score increases with duration, or that there is a positive correlation between duration and score, or that higher duration
  values correspond to higher scores, or that there is an upward trend. Submissions may also note the scatter or the appearance
  of multiple trends/clusters in the data (from the three subgroups with different slopes and baselines).
