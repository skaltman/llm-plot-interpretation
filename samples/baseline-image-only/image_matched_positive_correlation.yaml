id: image_matched_positive_correlation
type: image_interpretation
tool:
  name: tool_show_image
  alias: show_plot
metadata:
  n_geoms: 1
  geom_type: point
  pattern_type: linear
  relationship: positive
  difficulty: easy
  pattern_source: standard
input:
  setup: |
    image_path <- "sample-images/baseline/positive_correlation.png"
  teardown: ""
  prompt: |
    Call the show_plot tool to display the visualization then briefly tell me what relationship you observe
target: |
  The plot shows a clear positive linear relationship between x and y.
  As x increases, y increases proportionally. A successful submission accurately
  describes this positive correlation.
