id: image_matched_department_values
type: image_interpretation
tool:
  name: tool_show_image
  alias: show_plot
metadata:
  n_geoms: 1
  geom_type: boxplot
  pattern_type: categorical
  relationship: group_differences
  difficulty: easy
  pattern_source: standard
input:
  setup: |
    image_path <- "sample-images/baseline/department_values.png"
  teardown: ""
  prompt: |
    to display the visualization, call the show_plot tool then briefly tell me what you observe in the plot
target: |
  The plot clearly shows differences across departments, with Engineering having the highest values, Sales showing intermediate values, and Support showing the lowest values. A successful submission accurately describes that values differ across departments, or that Engineering has higher values than Sales which has higher values than Support, or that there is a clear ordering with Support lowest and Engineering highest, or that the three departments show different levels in their values.
