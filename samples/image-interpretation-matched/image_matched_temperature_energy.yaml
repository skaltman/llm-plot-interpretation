id: image_matched_temperature_energy
type: image_interpretation
tool:
  name: tool_show_image
  alias: show_plot
metadata:
  n_geoms: 1
  geom_type: point
  pattern_type: quadratic
  relationship: u_shaped_with_groups
  difficulty: hard
  pattern_source: standard
input:
  setup: |
    image_path <- "sample-images/baseline/temperature_energy.png"
  teardown: ""
  prompt: |
    Please call the show_plot tool to display the visualization, then concisely tell me what patterns you see.
target: |
  The plot shows a U-shaped relationship between temperature and metric for
  both categories. Metric values are higher at temperature extremes
  (both very cold and very hot) and lower at moderate temperatures.
  Category A shows higher overall metric values compared to Category B
  across all temperatures. A successful submission accurately describes
  this U-shaped pattern and the difference between categories.
