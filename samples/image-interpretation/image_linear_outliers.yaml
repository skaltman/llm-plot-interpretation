id: image_linear_outliers
type: image_interpretation
tool:
  name: tool_show_image
  alias: show_plot
metadata:
  n_geoms: 1
  geom_type: point
  pattern_type: mixed
  pattern_source: unusual
  baseline_matched: none
  relationship: cluster_with_outliers
  difficulty: hard
input:
  setup: |
    image_path <- "sample-images/linear_outliers.png"
  teardown: ""
  prompt: |
    Use show_plot to view the data. Describe what you observe about the
    structure and distribution of points.
target: |
  The plot shows a dense central cluster of points concentrated around
  the middle of the plot, with additional outlier points that form a
  diagonal line or pattern extending from the lower left to upper right.
  Unlike typical random outliers, these outlier points follow a structured
  linear pattern, suggesting two different processes or groups in the data.
