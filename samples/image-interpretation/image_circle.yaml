id: image_circle
type: image_interpretation
tool:
  name: tool_show_image
  alias: show_plot
metadata:
  n_geoms: 1
  geom_type: point
  pattern_type: circle
  pattern_source: unusual
  baseline_matched: group_differences
  relationship: circle
  difficulty: medium
input:
  setup: |
    image_path <- "sample-images/circle.png"
  teardown: ""
  prompt: |
    Call show_plot to see the data pattern. What do you observe about
    the structure of the data?
target: |
  The plot shows a circle or ring of data points.
  The radius of the circle is approximately 6. There is no 
  data in the center of the ring. 
  A successful submission notices the ring shape and may point out
  the radius, diameter, or range of the data. 
