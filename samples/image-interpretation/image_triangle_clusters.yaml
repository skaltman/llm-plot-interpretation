id: image_triangle_clusters
type: image_interpretation
tool:
  name: tool_show_image
  alias: show_plot
metadata:
  n_geoms: 1
  geom_type: point
  pattern_type: clusters
  pattern_source: unusual
  baseline_matched: group_differences
  relationship: three_clusters
  difficulty: easy
input:
  setup: |
    image_path <- "sample-images/triangle_clusters.png"
  teardown: ""
  prompt: |
    Call the show_plot tool to display the data. What structure or pattern
    do you observe?
target: |
  The plot shows three distinct clusters or groups of points arranged in
  a triangular formation. Two clusters are positioned at the bottom left
  and bottom right, with a third cluster positioned above them at the top
  center, forming a triangle pattern. The clusters are well-separated from
  each other.
