id: blank_j_shaped
type: blank
tool:
  name: tool_create_blank_plot
  alias: create_ggplot
input:
  setup: |
    library(ggplot2)
    set.seed(556)
    df <- data.frame(
      price = seq(10, 100, length.out = 25),
      quantity = exp(seq(10, 100, length.out = 25) / 30) + rnorm(25, 0, 10)
    )
  teardown: |
    rm(df)
  prompt: |
    Make a scatter plot of price vs quantity from df.
    Describe the relationship between price and quantity demanded.
target: |
  The plot is blank or empty with no data points or visualization shown.
