id: blank_exponential_growth
type: blank
tool:
  name: tool_create_blank_plot
  alias: create_ggplot
input:
  setup: |
    library(ggplot2)
    set.seed(890)
    df <- data.frame(
      month = 1:18,
      users = round(100 * exp(0.15 * (1:18)) + rnorm(18, 0, 50))
    )
  teardown: |
    rm(df)
  prompt: |
    Create a line plot showing how the number of users changes over the months
    in df. Describe the trend you observe.
target: |
  The plot is blank or empty with no data points or visualization shown.
