id: table_quadratic
type: baseline
tool:
  name: tool_create_table
  alias: analyze_data
input:
  setup: |
    library(dplyr)
    set.seed(334)
    x_vals <- seq(-10, 10, length.out = 30)
    df <- tibble::tibble(
      velocity = x_vals,
      drag = 0.5 * x_vals^2 + rnorm(30, 0, 5)
    )
  teardown: |
    rm(df)
  prompt: |
    whats the relationship between `velocity` and `drag` in the df dataset?
    use dplyr operations (chain with %>%) to examine it. code returns tibble/dataframe.
    tell me what you observe
target: |
  The df dataset shows a quadratic or U-shaped relationship between velocity and drag.
  As velocity increases in either direction (positive or negative), drag increases,
  with minimum drag near zero velocity.
