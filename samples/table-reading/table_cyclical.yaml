id: table_cyclical
type: baseline
tool:
  name: tool_create_table
  alias: analyze_data
input:
  setup: |
    library(dplyr)
    set.seed(112)
    df <- tibble::tibble(
      week = 1:52,
      website_traffic = 1000 + 300 * sin(2 * pi * (1:52) / 52) + rnorm(52, 0, 50)
    )
  teardown: |
    rm(df)
  prompt: |
    theres a `website_traffic` column and a `week` column in df. can you analyze it
    with dplyr (chain with %>%) and look for any patterns? return tibble/dataframe.
    what patterns do you notice?
target: |
  The df dataset shows a cyclical or seasonal pattern in website_traffic over the 52 weeks.
  Traffic appears to fluctuate up and down throughout the year in a regular pattern.
