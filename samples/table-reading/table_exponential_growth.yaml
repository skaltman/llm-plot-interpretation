id: table_exponential_growth
type: baseline
tool:
  name: tool_create_table
  alias: analyze_data
input:
  setup: |
    library(dplyr)
    set.seed(890)
    df <- tibble::tibble(
      month = 1:18,
      users = round(100 * exp(0.15 * (1:18)) + rnorm(18, 0, 50))
    )
  teardown: |
    rm(df)
  prompt: |
    look at how the `users` column changes as `month` progresses in df. analyze with
    dplyr (use %>%). needs to return a tibble/dataframe. what kind of trend do you see?
target: |
  The df dataset shows exponential growth in users over time. The number of users
  increases rapidly as months progress, with the growth rate accelerating.
