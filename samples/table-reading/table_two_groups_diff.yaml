id: table_two_groups_diff
type: baseline
tool:
  name: tool_create_table
  alias: analyze_data
input:
  setup: |
    library(dplyr)
    set.seed(567)
    df <- tibble::tibble(
      treatment = rep(c("control", "drug"), each = 20),
      blood_pressure = c(rnorm(20, 140, 10), rnorm(20, 120, 10))
    )
  teardown: |
    rm(df)
  prompt: |
    compare `blood_pressure` between the different `treatment` groups in df.
    use dplyr with %>% to group and compare them. return a tibble/dataframe.
    whats different between the groups?
target: |
  The df dataset shows a clear difference between treatment groups. The control group
  has higher blood pressure (around 140) compared to the drug group (around 120).
