id: table_bimodal
type: baseline
tool:
  name: tool_create_table
  alias: analyze_data
input:
  setup: |
    library(dplyr)
    set.seed(667)
    df <- tibble::tibble(
      value = c(rnorm(30, 20, 3), rnorm(30, 40, 3))
    )
  teardown: |
    rm(df)
  prompt: |
    check out the `value` column in df and see what the distribution looks like.
    use dplyr (chain with %>%) and make sure code returns tibble or dataframe.
    what do you observe?
target: |
  The df dataset shows a bimodal distribution with two distinct clusters of values.
  One group of values centers around 20 and another group centers around 40.
