id: table_step_function
type: baseline
tool:
  name: tool_create_table
  alias: analyze_data
input:
  setup: |
    library(dplyr)
    set.seed(778)
    df <- tibble::tibble(
      dosage = seq(0, 100, length.out = 40),
      effect = ifelse(seq(0, 100, length.out = 40) < 30, 10,
                     ifelse(seq(0, 100, length.out = 40) < 60, 50, 90)) +
              rnorm(40, 0, 3)
    )
  teardown: |
    rm(df)
  prompt: |
    how does `effect` change at different `dosage` levels in df? analyze using dplyr
    with %>%. code should return a tibble/dataframe. what do you see happening?
target: |
  The df dataset shows a step-function or threshold relationship between dosage and effect.
  Effect increases in distinct jumps or plateaus at different dosage levels rather than
  changing smoothly.
