id: table_flat_trend
type: baseline
tool:
  name: tool_create_table
  alias: analyze_data
input:
  setup: |
    library(dplyr)
    set.seed(223)
    df <- tibble::tibble(
      quarter = 1:20,
      revenue = rnorm(20, 500000, 25000)
    )
  teardown: |
    rm(df)
  prompt: |
    analyze the `revenue` column across different `quarter` values in df using dplyr
    (with %>%). should return a tibble or dataframe. whats happening with revenue over time?
target: |
  The df dataset shows no clear trend in revenue over time. Revenue remains relatively
  stable around 500,000 across all quarters with random variation.
