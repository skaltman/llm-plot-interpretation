id: table_with_outliers
type: baseline
tool:
  name: tool_create_table
  alias: analyze_data
input:
  setup: |
    library(dplyr)
    set.seed(445)
    values <- c(rnorm(25, 50, 5), 95, 98, 5, 8)
    df <- tibble::tibble(
      employee_id = 1:29,
      performance = values
    )
  teardown: |
    rm(df)
  prompt: |
    Can you look at the distribution of the `performance` column in df? use some
    dplyr stuff with %>%. needs to return tibble or dataframe. what do you see about
    the distribution?
target: |
  The df dataset shows that most employees have performance scores around 50, but there
  are some outliers with unusually high values (around 95-98) and unusually low values
  (around 5-8).
