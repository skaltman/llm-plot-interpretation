id: table_decline
type: baseline
tool:
  name: tool_create_table
  alias: analyze_data
input:
  setup: |
    library(dplyr)
    set.seed(901)
    df <- tibble::tibble(
      year = 2010:2024,
      emissions = seq(500, 250, length.out = 15) + rnorm(15, 0, 20)
    )
  teardown: |
    rm(df)
  prompt: |
    how does `emissions` change over `year` in the df data? use 1-3 dplyr operations
    with %>%. code must return tibble or dataframe. what trend are you seeing?
target: |
  The df dataset shows a declining trend in emissions over time. Emissions decrease
  steadily from around 500 in 2010 to around 250 in 2024.
