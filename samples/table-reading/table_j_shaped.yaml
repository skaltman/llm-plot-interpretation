id: table_j_shaped
type: baseline
tool:
  name: tool_create_table
  alias: analyze_data
input:
  setup: |
    library(dplyr)
    set.seed(556)
    df <- tibble::tibble(
      price = seq(10, 100, length.out = 25),
      quantity = exp(seq(10, 100, length.out = 25) / 30) + rnorm(25, 0, 10)
    )
  teardown: |
    rm(df)
  prompt: |
    im curious about how `price` and `quantity` relate in df. analyze with 1-3 dplyr
    operations (use %>%). return a tibble/dataframe. what relationship do you observe?
target: |
  The df dataset shows a J-shaped or exponential relationship between price and quantity.
  As price increases, quantity increases at an accelerating rate.
