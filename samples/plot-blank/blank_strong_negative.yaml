id: blank_strong_negative
type: blank
tool:
  name: tool_create_blank_plot
  alias: create_ggplot
input:
  setup: |
    library(ggplot2)
    set.seed(234)
    df <- data.frame(
      temperature = seq(0, 50, length.out = 25),
      efficiency = 100 - 1.8 * seq(0, 50, length.out = 25) + rnorm(25, 0, 3)
    )
  teardown: |
    rm(df)
  prompt: |
    Create a scatter plot showing the relationship between temperature and
    efficiency in the df dataset. Describe what you observe about how efficiency
    changes as temperature increases.
target: |
  The plot is blank or empty with no data points or visualization shown.
