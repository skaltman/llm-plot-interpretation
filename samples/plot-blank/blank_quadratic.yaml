id: blank_quadratic
type: blank
tool:
  name: tool_create_blank_plot
  alias: create_ggplot
input:
  setup: |
    library(ggplot2)
    set.seed(334)
    x_vals <- seq(-10, 10, length.out = 30)
    df <- data.frame(
      velocity = x_vals,
      drag = 0.5 * x_vals^2 + rnorm(30, 0, 5)
    )
  teardown: |
    rm(df)
  prompt: |
    Create a scatter plot of velocity vs drag using df.
    Describe the relationship between velocity and drag force.
target: |
  The plot is blank or empty with no data points or visualization shown.
