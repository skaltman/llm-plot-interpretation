id: blank_decline
type: blank
tool:
  name: tool_create_blank_plot
  alias: create_ggplot
input:
  setup: |
    library(ggplot2)
    set.seed(901)
    df <- data.frame(
      year = 2010:2024,
      emissions = seq(500, 250, length.out = 15) + rnorm(15, 0, 20)
    )
  teardown: |
    rm(df)
  prompt: |
    Plot emissions over time using df. What trend do you observe in the data?
target: |
  The plot is blank or empty with no data points or visualization shown.
